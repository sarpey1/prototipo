name: Diagnose unlimited megas

on:
  push:
    branches: [megaradar-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        continue-on-error: true
        run: gradle build --no-daemon -q
      - name: Diagnose
        continue-on-error: true
        run: bash ci/diagnose.sh
      - name: Publish diagnosis to megaradar-diag
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r diag /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q && git config user.name "megaradar-ci" && git config user.email "megaradar-ci@users.noreply.github.com"
          git checkout -q -b megaradar-diag && git add -A && git commit -q -m "Diagnosis ${{ github.sha }}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" megaradar-diag
