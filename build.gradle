plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // src/main = codice comune (server + client), src/client = solo client.
    // Impedisce di usare per sbaglio classi client nel codice che gira sul server dedicato.
    splitEnvironmentSourceSets()

    mods {
        "megaradar" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Nessuna dipendenza esterna obbligatoria: Mega Showdown è solo "suggests".
    // L'integrazione avviene via tag di strutture (datapack), non via API Java.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mappature ufficiali Mojang: le stesse usate da Cobblemon e Mega Showdown.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Permette di inviare comandi alla console del server di test (usato dalla CI)
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}
